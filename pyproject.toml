[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flawlessplan"
version = "0.8.0"
description = "Floor plans made and changed by talking to Claude: from a sketch, a photo or your own measurements, drawn to scale and redrawn as you ask."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "shapely>=2", "numpy", "resvg-py>=0.5", "mcp>=2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flawlessplan = "flawlessplan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flawlessplan"]

[tool.hatch.build.targets.sdist]
include = ["flawlessplan", "README.md", "pyproject.toml"]
